<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {% include head.html %}

  <body>

    <main class="home" aria-label="Content">
      <div class="home-container">
        
        <div class="home-left">
          <img src="{{ site.profile_picture | relative_url }}" alt="{{ site.author }}" class="profile-photo">
        </div>

        <div class="home-right">
          <h1 class="page-heading">{{ site.author }}</h1>
          
          <div class="bio">
            {{ content }}
          </div>

          <div class="social-links">
            <a href="https://github.com/{{ site.github_username }}">
              <span class="icon">{% include icon-github.svg %}</span>
              GitHub
            </a>
            
            <a href="https://linkedin.com/in/{{ site.linkedin_username }}">
              <span class="icon">{% include icon-linkedin.svg %}</span>
              LinkedIn
            </a>
          </div>
        </div>

      </div>
    </main>

  </body>

</html>
